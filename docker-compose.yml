services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - galaxify-network

  server:
    build: .
    container_name: server
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/galaxify
    networks:
      - galaxify-network

volumes:
  mongo-data:
    driver: local

networks:
  galaxify-network:
    driver: bridge
