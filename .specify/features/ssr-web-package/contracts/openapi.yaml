openapi: 3.0.0
info:
  title: Web SSR Server API
  version: 1.0.0
paths:
  /healthz:
    get:
      summary: Health Check
      description: Responds with the server's health status.
      responses:
        '200':
          description: Server is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
