openapi: 3.0.0
info:
  title: Galaxify API
  version: 1.0.0
  description: The API for the Galaxify project.
paths:
  /api/health:
    get:
      summary: Health Check
      description: Returns the health status of the API.
      responses:
        '200':
          description: API is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
